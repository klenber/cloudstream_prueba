name: Build Plugins

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'
      - name: Build plugins
        run: gradle makePlugins
      - name: Collect plugins and generate index
        run: |
          mkdir -p docs
          find . -name "*.cs3" -exec cp {} docs/ \;
          plugins=""
          for f in docs/*.cs3; do
            name=$(basename "$f" .cs3)
            plugins="${plugins}{\"url\":\"https://klenber.github.io/cloudstream_prueba/${name}.cs3\",\"name\":\"${name}\",\"internalName\":\"${name}\",\"version\":1,\"authors\":[\"klenber\"],\"repositoryUrl\":\"https://github.com/klenber/cloudstream_prueba\",\"status\":1,\"tvTypes\":[\"Anime\"],\"language\":\"es\",\"iconUrl\":\"https://www.google.com/s2/favicons?domain=animelatinohd.com&sz=32\"},"
          done
          plugins="${plugins%,}"
          printf '{"name":"CloudstreamPrueba","description":"Repositorio de prueba","manifestVersion":1,"pluginLists":[{"url":"https://klenber.github.io/cloudstream_prueba/index.json","name":"All plugins"}],"plugins":[%s]}' "$plugins" > docs/index.json
          cat docs/index.json
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages