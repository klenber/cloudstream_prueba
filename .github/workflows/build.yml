name: Build Plugins

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'
      - name: Build plugins
        run: gradle makePlugins
      - name: List output files
        run: |
          echo "=== CS3 files ==="
          find . -name "*.cs3" 2>/dev/null
          echo "=== Build folders ==="
          find . -path "*/build/outputs*" -type d 2>/dev/null
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: builds/outputs/plugins
          branch: gh-pages