name: Build Plugins

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'
      - name: Build plugins
        run: gradle makePlugins
      - name: Collect plugins and generate index
        run: |
          mkdir -p docs
          find . -name "*.cs3" -exec cp {} docs/ \;
          echo '{"plugins":[' > docs/index.json
          first=true
          for f in docs/*.cs3; do
            name=$(basename "$f" .cs3)
            if [ "$first" = true ]; then
              first=false
            else
              echo ',' >> docs/index.json
            fi
            echo "{\"url\":\"https://klenber.github.io/cloudstream_prueba/${name}.cs3\",\"name\":\"${name}\"}" >> docs/index.json
          done
          echo ']}' >> docs/index.json
          cat docs/index.json
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs
          branch: gh-pages